; RedCraft for Red Dead Redemption 2 (story mode only). Put this next to RedCraft.asi.
; Every key is optional; missing keys use the default shown.

[Link]
; Shared-memory name. Must match Minecraft's -Dredcraft.link (default Local\RedCraft_Shared_v1).
MappingName=Local\RedCraft_Shared_v1
; How long Minecraft may stay silent before the link counts as STALE (0 = protocol default, 3000 ms).
McTimeoutMs=0

[World]
; 1 Minecraft block per RDR2 metre.
BlocksPerMetre=1.0
; Metres from the player's reference point down to the feet (measure with the overlay's "above ground").
FeetOffset=1.0
; Added to Minecraft Y after scaling.
YOffset=0

[Debug]
; Link status overlay in the top-left corner.
Overlay=1
; Write the cost of every script tick to RedCraft.log (very verbose).
LogTickCost=0
