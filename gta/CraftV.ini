; CraftV for GTA V (story mode only). Put this next to CraftV.asi.
; Every key is optional; missing keys use the default shown.

[Link]
; Shared-memory name. Must match Minecraft's -Dcraftv.link (default Local\CraftV_Shared_v1).
MappingName=Local\CraftV_Shared_v1
; How long Minecraft may stay silent before the link counts as STALE (0 = protocol default, 3000 ms).
McTimeoutMs=0

[World]
; 1 Minecraft block per GTA metre.
BlocksPerMetre=1.0
; Metres from the player's reference point down to the feet (check with the overlay's "above ground").
FeetOffset=1.0
; Added to Minecraft Y after scaling.
YOffset=0

[Terrain]
; Ground probes per game frame for your friends' terrain (higher = faster ground, more cost per frame).
ProbesPerTick=64
; Most time (microseconds) ground probing may take in one frame; it stops early and carries on next frame.
ProbeBudgetUs=1500
; Frames to wait after asking GTA to load collision for a chunk far from you.
CollisionWaitTicks=10
; Chunks closer to you than this (metres) are probed right away.
NearDistance=150
; Empty scans of a chunk before it's answered as "no ground".
MaxAttempts=3

[Passthrough]
; The Minecraft view: real Minecraft (hand, hotbar, hearts, blocks, friends) drawn into GTA. Needs ReShade with
; add-on support (see INSTALL.txt). Auto = on whenever ReShade is loaded; Off = start off. F7 toggles it in game.
Mode=Auto
; Minecraft's frame is at most this many pixels (it's scaled up to GTA's picture). Lower = faster.
MaxPixels=1440000
; 1 = hide GTA's own HUD and minimap while the Minecraft view is on.
HideGtaHud=0
; GTA damage per Minecraft half heart when you hit someone (a diamond sword does 7 half hearts).
MeleeDamagePerHalfHeart=10

[Minecraft]
; How much of GTA is Minecraft while the Minecraft view is on. The F8 menu changes these too.
; Minecraft's crosshair (also in third person), the first-person hand, and the hotbar/hearts/hunger: 1 = shown.
Crosshair=1
Hand=1
Hud=1
; The box around the block you look at: 0 = never, 1 = placed blocks only (not the hidden street), 2 = everywhere.
BlockOutline=1
; Minecraft's frames per second (60, 90, 120, 144; 0 = unlimited). Higher keeps Steve sharp when you turn fast.
FrameRate=90
; Steve sits in cars (1), or GTA's own driver shows in cars (0).
SteveInCars=1
; 1 = Space is Minecraft's straight jump (JumpHeight metres); 0 = GTA's own jump and climbing.
MinecraftJump=1
JumpHeight=1.3
; 1 = getting hurt in GTA costs Minecraft hearts, and dying in Minecraft gets you wasted.
GtaDamage=1
; 1 = Minecraft TNT explodes in GTA too; 1 = Minecraft arrows hurt GTA's people; 1 = torches light up GTA.
Explosions=1
ArrowsHurt=1
TorchLight=1
; 1 = falls cost hearts the way Minecraft counts them (more than 3 blocks down).
FallDamage=1
; The key that opens Minecraft's inventory: E, Tab or I.
InventoryKey=E

[Blocks]
; Minecraft blocks you and friends build are solid in GTA (invisible collision boxes). At most this many at once:
; GTA crashes with too many script objects (around 1500). 0 = no collision.
MaxProps=400
; Metres around you where blocks get collision, nearest first.
Radius=48

[Debug]
; CraftV's status overlay (1 = on, 0 = off).
Overlay=1
; Where it goes: TopRight (below GTA's money and wanted stars) or TopLeft.
OverlayCorner=TopRight
; 1 = two extra lines with counters, positions and session flags (for bug reports).
OverlayDetails=0
; Write the cost of every script tick to CraftV.log (very verbose).
LogTickCost=0
