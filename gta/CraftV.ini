; CraftV for GTA V (story mode only). Put this next to CraftV.asi.
; Every key is optional; missing keys use the default shown.

[Link]
; Shared-memory name. Must match Minecraft's -Dcraftv.link (default Local\CraftV_Shared_v1).
MappingName=Local\CraftV_Shared_v1
; How long Minecraft may stay silent before the link counts as STALE (0 = protocol default, 3000 ms).
McTimeoutMs=0

[World]
; 1 Minecraft block per GTA metre.
BlocksPerMetre=1.0
; Metres from the player's reference point down to the feet (check with the overlay's "above ground").
FeetOffset=1.0
; Added to Minecraft Y after scaling.
YOffset=0

[Terrain]
; Ground probes per game frame for your friends' terrain (higher = faster ground, more cost per frame).
ProbesPerTick=64
; Frames to wait after asking GTA to load collision for a chunk far from you.
CollisionWaitTicks=10
; Chunks closer to you than this (metres) are probed right away.
NearDistance=150
; Empty scans of a chunk before it's answered as "no ground".
MaxAttempts=3

[Debug]
; CraftV's status overlay (1 = on, 0 = off).
Overlay=1
; Where it goes: TopRight (below GTA's money and wanted stars) or TopLeft.
OverlayCorner=TopRight
; 1 = two extra lines with counters, positions and session flags (for bug reports).
OverlayDetails=0
; Write the cost of every script tick to CraftV.log (very verbose).
LogTickCost=0
